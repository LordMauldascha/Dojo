<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Dojo</title>
  <desc id="desc">Dojo, a platform to create, evaluate and test LLM skills. A gold seal with the character 道, the flow skill and testcase, run, judge, score, and an example result matrix of testcases against models.</desc>
  <defs>
    <radialGradient id="glow" cx="1" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffc34d" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#ffc34d" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffc34d" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .serif{font-family:'Shippori Mincho',Georgia,'Times New Roman',serif;font-weight:600}
      .paper{fill:#f1d9a8} .muted{fill:#b9a27a} .gold{fill:#ffc34d}
    </style>
  </defs>

  <rect width="1200" height="400" rx="4" fill="#2c2015"/>
  <rect width="1200" height="400" rx="4" fill="url(#glow)"/>

