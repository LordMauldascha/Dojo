# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Form/Model/'
            - '../src/Kernel.php'
            # value objects created with "new" or by #[MapQueryString], never injected
            - '../src/Ai/LlmConfiguration.php'
            - '../src/Ai/LlmConfigurationPageResult.php'
            - '../src/Pagination/ListQuery.php'
            - '../src/Pagination/Page.php'
            - '../src/Run/RunCompareQuery.php'
            - '../src/Run/RunVersionDiff.php'

    Sulu\Twig\Extensions\ComponentExtension: ~

    app.null_logger:
        class: Psr\Log\NullLogger

    # ai-bundle has no config key for the Claude Code bridge, so the platform is built via its factory
    Symfony\AI\Platform\PlatformInterface:
        public: true
        factory: ['Symfony\AI\Platform\Bridge\ClaudeCode\Factory', 'createPlatform']
        arguments:
            $environment:
                ANTHROPIC_API_KEY: '%env(ANTHROPIC_API_KEY)%'
                CLAUDE_CODE_OAUTH_TOKEN: '%env(CLAUDE_CODE_OAUTH_TOKEN)%'
                # false removes the variable from the environment the CLI child inherits (Symfony Process)
                DATABASE_URL: false
                APP_SECRET: false
                API_KEY_ENCRYPTION_KEY: false
                POSTGRES_PASSWORD: false
                MESSENGER_TRANSPORT_DSN: false
                MAILER_DSN: false
                OPENAI_API_KEY: false
                GEMINI_API_KEY: false
                DEEPSEEK_API_KEY: false
                HUGGINGFACE_API_KEY: false
            $eventDispatcher: '@event_dispatcher'
            # the platform logs the full command line including the prompt, which must not reach the logs
            $logger: '@app.null_logger'

    # the Hugging Face discovery commands use the token stored in the LLM Configuration
    Symfony\AI\Platform\Bridge\HuggingFace\ApiClient:
        factory: ['@App\Ai\HuggingFaceHub', 'apiClient']
    Symfony\AI\Platform\Bridge\HuggingFace\Command\ModelListCommand: ~
    Symfony\AI\Platform\Bridge\HuggingFace\Command\ModelInfoCommand: ~

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
