name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Stages: Check -> Test. The test jobs only start when all check jobs succeeded.
jobs:
  php-checks:
    name: PHP checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-php-app

      # PHPStan reads var/cache/dev/App_KernelDevDebugContainer.xml
      - name: Warm up the dev container
        run: php bin/console cache:warmup

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHP CS Fixer (dry run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Twig CS Fixer (lint)
        run: vendor/bin/twig-cs-fixer lint

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: Type check
        run: npx tsc --noEmit

      # Fails on TypeScript and Sass errors
      - name: Build assets
        run: npm run build

  doctrine-migrations:
    name: Doctrine migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      # In the test env Doctrine appends _test to the database name (app_test)
      DATABASE_URL: postgresql://app:ci@127.0.0.1:5432/app?serverVersion=16&charset=utf8
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-php-app

      # Without entities and migrations there is nothing to check: migrate fails with "no registered
      # migrations" and schema:validate reports a false "not in sync". The checks start with the first file.
      - name: Detect entities and migrations
        id: detect
        run: |
          if [ -n "$(find src/Entity migrations -name '*.php' 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No entities or migrations yet, skipping the migration checks"
          fi

      - name: Create database
        if: steps.detect.outputs.present == 'true'
        run: php bin/console doctrine:database:create --if-not-exists

      - name: Run migrations
        if: steps.detect.outputs.present == 'true'
        run: php bin/console doctrine:migrations:migrate --no-interaction

      # Fails when the mapping and the migrated schema differ, e.g. an entity change without a migration
      - name: Validate schema
        if: steps.detect.outputs.present == 'true'
        run: php bin/console doctrine:schema:validate

  phpunit:
    name: PHPUnit
    needs: [php-checks, frontend-checks, doctrine-migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # In the test env Doctrine appends _test to the database name (app_test)
      DATABASE_URL: postgresql://app:ci@127.0.0.1:5432/app?serverVersion=16&charset=utf8
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-php-app

      - name: Create test database and schema
        run: |
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:migrations:migrate --no-interaction --env=test

      # The home page renders the Encore entrypoints, so public/build/entrypoints.json must exist
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build assets
        run: npm run build

      - name: PHPUnit
        run: php bin/phpunit

  vitest:
    name: Vitest
    needs: [php-checks, frontend-checks, doctrine-migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Vitest
        run: npm test
